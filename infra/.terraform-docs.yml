formatter: "markdown table"

output:
  file: README.md
  mode: replace

header-from: main.tf

content: |-
  {{ .Header }}
  {{ .Providers }}
  {{ .Requirements }}
  {{ .Resources }}
  {{ .Inputs }}
  {{ .Outputs }}
  {{ .Footer }}

sections:
  hide:
    - providers
    - requirements
    - resources

settings:
  anchor: false
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true

recursive:
  enabled: false
