trigger:
  branches:
    include:
      - '*'

pr:
- main

schedules:
- cron: "0 2 * * *"          # At 2:00 AM UTC (4:00 AM CEST) everyday
  displayName: Nightly Renovate
  branches:
    include:
      - main
  always: true

variables:
  IMAGE_NAME: 'nn-devops-challenge'
  IMAGE_TAG: '$(Build.BuildNumber)'
  ECR_REPO: 'nn-devops-challenge'

  CONTAINER_REGISTRY: '$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com'
  IMAGE_FULL: '$(CONTAINER_REGISTRY)/$(ECR_REPO):$(IMAGE_TAG)'

  CLUSTER_NAME_DEV: 'nn-devops-challenge-cluster'
  CLUSTER_NAME_STAGING: 'nn-devops-challenge-cluster'
  CLUSTER_NAME_PROD: 'nn-devops-challenge-cluster'

  NAMESPACE_DEV: 'nn-devops-dev'
  NAMESPACE_STAGING: 'nn-devops-staging'
  NAMESPACE_PROD: 'nn-devops-prod'

  RUN_RENOVATE: 'false'

stages:
  # 0) Renovate 
  - template: .azure-pipelines/stages-renovate.yml

  # 1) Build + Tests + Trivy
  - template: .azure-pipelines/stages-build-test-scan.yml

  # 2) Push a ECR + Cosign
  - template: .azure-pipelines/stages-push-and-sign.yml

  # 3) Deploy DEV
  - template: .azure-pipelines/stages-deploy.yml
    parameters:
      stageName: 'Deploy_Dev'
      displayName: 'Deploy to DEV (namespace: nn-devops-dev)'
      envName: 'dev'
      environmentName: 'dev'
      namespaceVar: '$(NAMESPACE_DEV)'
      clusterNameVar: '$(CLUSTER_NAME_DEV)'
      dependsOnStage: 'PushAndSign'
      extraCondition: "or(startsWith(variables['Build.SourceBranch'], 'refs/pull/'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))"

  # 4) Deploy STAGING
  - template: .azure-pipelines/stages-deploy.yml
    parameters:
      stageName: 'Deploy_Staging'
      displayName: 'Deploy to STAGING (namespace: nn-devops-staging)'
      envName: 'staging'
      environmentName: 'staging'
      namespaceVar: '$(NAMESPACE_STAGING)'
      clusterNameVar: '$(CLUSTER_NAME_STAGING)'
      dependsOnStage: 'Deploy_Dev'
      extraCondition: "and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))"

  # 5) Deploy PROD
  - template: .azure-pipelines/stages-deploy.yml
    parameters:
      stageName: 'Deploy_Prod'
      displayName: 'Deploy to PROD (namespace: nn-devops-prod)'
      envName: 'prod'
      environmentName: 'prod'
      namespaceVar: '$(NAMESPACE_PROD)'
      clusterNameVar: '$(CLUSTER_NAME_PROD)'
      dependsOnStage: 'Deploy_Staging'
      extraCondition: "and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))"
