              ./scripts/deploy.sh "staging" "${IMAGE}" ./helm "${NAMESPACE}"
            displayName: Helm deploy to staging
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_REGION: $(AWS_REGION)

# =====================================================================
# STAGE 5: DEPLOY TO PROD
#   - Only on push to main (not PR)
#   - Requires Environment 'prod' approval
# =====================================================================
- stage: Deploy_Prod
  displayName: 'Deploy to PROD (namespace: nn-devops-prod)'
