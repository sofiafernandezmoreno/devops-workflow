trigger:
  branches:
    include:
      - '*'          

pr:
- main              

schedules:
- cron: "0 2 * * *"          
  displayName: Nightly Renovate
  branches:
    include:
      - main
  always: true

variables:
  IMAGE_NAME: 'nn-devops-challenge'
  IMAGE_TAG: '$(Build.BuildNumber)'
  ECR_REPO: 'nn-devops-challenge'

  CONTAINER_REGISTRY: '$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com'
  IMAGE_FULL: '$(CONTAINER_REGISTRY)/$(ECR_REPO):$(IMAGE_TAG)'

  CLUSTER_NAME_DEV: 'nn-devops-challenge-cluster'
  CLUSTER_NAME_STAGING: 'nn-devops-challenge-cluster'
  CLUSTER_NAME_PROD: 'nn-devops-challenge-cluster'

  NAMESPACE_DEV: 'nn-devops-dev'
  NAMESPACE_STAGING: 'nn-devops-staging'
  NAMESPACE_PROD: 'nn-devops-prod'

  RUN_RENOVATE: 'false'

stages:
# 0) Renovate (solo schedule o RUN_RENOVATE=true)
- stage: Renovate
  displayName: Renovate Dependencies
  condition: >
    or(
      eq(variables['Build.Reason'], 'Schedule'),
      eq(variables['RUN_RENOVATE'], 'true')
    )
  jobs:
  - template: .azure-pipelines/job-renovate.yml

# 1) Build + Tests + Trivy (siempre)
- stage: BuildTestScan
  displayName: Build, Test & Security Scan
  template: .azure-pipelines/job-build-test-scan.yml

# 2) Push to ECR + Cosign
#    - PR -> main
#    - o builds en main
- stage: PushAndSign
  displayName: Push to ECR & Cosign
  dependsOn: BuildTestScan
  condition: >
    and(
      succeeded(),
      or(
        eq(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    )
  jobs:
  - template: .azure-pipelines/job-push-and-sign.yml

# 3) Deploy DEV (PR -> main + main)
- stage: Deploy_Dev
  displayName: 'Deploy to DEV (namespace: nn-devops-dev)'
  dependsOn: PushAndSign
  condition: succeeded()
  jobs:
  - template: .azure-pipelines/job-deploy.yml
    parameters:
      envName: 'dev'
      environmentName: 'dev'
      namespaceVar: '$(NAMESPACE_DEV)'
      clusterNameVar: '$(CLUSTER_NAME_DEV)'

# 4) Deploy STAGING (solo main, no PR)
- stage: Deploy_Staging
  displayName: 'Deploy to STAGING (namespace: nn-devops-staging)'
  dependsOn: Deploy_Dev
  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest')
    )
  jobs:
  - template: .azure-pipelines/job-deploy.yml
    parameters:
      envName: 'staging'
      environmentName: 'staging'
      namespaceVar: '$(NAMESPACE_STAGING)'
      clusterNameVar: '$(CLUSTER_NAME_STAGING)'

# 5) Deploy PROD (igual que STAGING)
- stage: Deploy_Prod
  displayName: 'Deploy to PROD (namespace: nn-devops-prod)'
  dependsOn: Deploy_Staging
  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest')
    )
  jobs:
  - template: .azure-pipelines/job-deploy.yml
    parameters:
      envName: 'prod'
      environmentName: 'prod'
      namespaceVar: '$(NAMESPACE_PROD)'
      clusterNameVar: '$(CLUSTER_NAME_PROD)'
