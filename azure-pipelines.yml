              echo "$(COSIGN_PUBLIC_KEY_B64)" | base64 -d > cosign.pub
              cosign verify --key cosign.pub "${IMAGE}"
            displayName: Verify signature (STAGING gate)

          - bash: |
              set -euo pipefail
              source $(Pipeline.Workspace)/image.env

              CLUSTER_NAME="$(CLUSTER_NAME_STAGING)"
              NAMESPACE="$(NAMESPACE_STAGING)"

              if ! command -v aws >/dev/null 2>&1; then
                echo "Installing AWS CLI..."
                curl -sSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
                sudo installer -pkg AWSCLIV2.pkg -target /
              fi

              if ! command -v helm >/dev/null 2>&1; then
                curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
              fi

              aws eks update-kubeconfig --region "$(AWS_REGION)" --name "${CLUSTER_NAME}"

              kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1 || \
                kubectl create namespace "${NAMESPACE}"

              ./scripts/deploy.sh staging "${IMAGE}" ./helm "${NAMESPACE}"
            displayName: Helm deploy to STAGING
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_REGION: $(AWS_REGION)

# =========================================================
# STAGE 5 — DEPLOY PROD
#   - Igual condición que STAGING
# =========================================================
- stage: Deploy_Prod
  displayName: Deploy to PROD
  dependsOn: Deploy_Staging
  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest')
    )
  jobs:
  - deployment: deploy_prod
    displayName: Deploy to PROD
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: image-ref
            displayName: Download image-ref

          - bash: |
              set -euo pipefail
              IMAGE="$(cat $(Pipeline.Workspace)/image-ref/image.txt)"
              echo "IMAGE=${IMAGE}" >> $(Pipeline.Workspace)/image.env
            displayName: Read image reference

          - bash: |
