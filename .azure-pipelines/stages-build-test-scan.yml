stages:
- stage: BuildTestScan
  displayName: Build, Test & Security Scan
  condition: ne(variables['Build.Reason'], 'Schedule')
  jobs:
  - job: build_test_scan
    displayName: Build + Tests + Trivy
    pool:
      name: 'sofia-self-hosted'
    steps:
    - checkout: self

    - task: Bash@3
      displayName: Unit tests (Maven)
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          cd app
          mvn -q -DskipTests=false test

    - task: Bash@3
      displayName: Build Docker image
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          cd app
          docker build -t "$(IMAGE_FULL)" .

    - task: Bash@3
      displayName: Trivy scan (fail on CRITICAL)
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          if ! command -v trivy >/dev/null 2>&1; then
            brew install trivy || true
          fi
          trivy image --severity CRITICAL --exit-code 1 --no-progress "$(IMAGE_FULL)"

    - publish: $(Build.SourcesDirectory)
      artifact: src
      displayName: Publish source artifact
