# job-deploy.yml  (GENERIC VERSION)

parameters:
  envName: ""            # dev / staging / prod
  environmentName: ""    # Azure DevOps Environment name
  namespaceVar: ""       # namespace in Kubernetes
  clusterNameVar: ""     # EKS cluster name variable
  chartPath: "./helm"    # Helm chart default path

jobs:
- deployment: deploy_${{ parameters.envName }}
  displayName: Deploy to ${{ parameters.envName }}
  environment: ${{ parameters.environmentName }}

  strategy:
    runOnce:
      deploy:

        steps:
        - checkout: self
          displayName: Checkout code

        - download: current
          artifact: image-ref
          displayName: Download image-ref artifact

        - task: Bash@3
          displayName: Helm deploy to ${{ parameters.envName }}
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_REGION: $(AWS_REGION)
            COSIGN_PUBLIC_KEY_B64: $(COSIGN_PUBLIC_KEY_B64)
            CONTAINER_REGISTRY: $(CONTAINER_REGISTRY)
          inputs:
            targetType: inline
            script: |
              set -euo pipefail

              NAMESPACE="${{ parameters.namespaceVar }}"
              CLUSTER_NAME="${{ parameters.clusterNameVar }}"
              CHART_PATH="${{ parameters.chartPath }}"

              IMAGE_TAG_REF="$(cat $(Pipeline.Workspace)/image-ref/image-tag.txt)"
              IMAGE_DIGEST_REF="$(cat $(Pipeline.Workspace)/image-ref/image-digest.txt)"

              echo "Namespace: ${NAMESPACE}"
              echo "Cluster: ${CLUSTER_NAME}"
              echo "Image tag: ${IMAGE_TAG_REF}"
              echo "Image digest: ${IMAGE_DIGEST_REF}"

              echo "Decoding Cosign public key..."
              echo "$COSIGN_PUBLIC_KEY_B64" | base64 -d > cosign.pub

              echo "Logging in to ECR..."
              aws ecr get-login-password --region "$(AWS_REGION)" \
                | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

              echo "Installing Cosign..."
              curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
              chmod +x cosign

              echo "Verifying signature for image digest..."
              ./cosign verify \
                --key cosign.pub \
                --insecure-ignore-tlog \
                "${IMAGE_DIGEST_REF}"

              echo "Updating kubeconfig..."
              aws eks update-kubeconfig --region "$(AWS_REGION)" --name "${CLUSTER_NAME}"

              echo "Ensuring namespace exists..."
              kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1 || \
                kubectl create namespace "${NAMESPACE}"

              echo "Deploying with Helm (env: ${{ parameters.envName }})..."
              helm upgrade --install nn-devops-challenge \
                "${CHART_PATH}" \
                --namespace "${NAMESPACE}" \
                --set image.repository="${IMAGE_TAG_REF%:*}" \
                --set image.tag="${IMAGE_TAG_REF##*:}"

              echo "Deployment finished successfully"
