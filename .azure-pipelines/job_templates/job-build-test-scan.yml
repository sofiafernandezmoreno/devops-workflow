# .azure-pipelines/job_templates/job-build-test-scan.yml
parameters: {}

jobs:
- job: build_test_scan
  displayName: Build + Tests + Trivy
  pool:
    name: 'sofia-self-hosted'
  steps:
  - checkout: self

  - task: Bash@3
    displayName: Unit tests (Maven)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        cd app
        mvn -q -DskipTests=false test

  - task: Bash@3
    displayName: Build Docker image (linux/amd64)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        cd app

        echo "Using IMAGE_FULL=${IMAGE_FULL}"

        # Crear (si no existe) y usar un builder multi-arch
        if ! docker buildx inspect multiarch-builder >/dev/null 2>&1; then
          echo "Creating buildx builder 'multiarch-builder'..."
          docker buildx create --use --name multiarch-builder
        else
          echo "Using existing buildx builder 'multiarch-builder'..."
          docker buildx use multiarch-builder
        fi

        echo "Building image for platform linux/amd64..."
        docker buildx build \
          --platform linux/amd64 \
          -t "${IMAGE_FULL}" \
          --load \
          .

        echo "Image built: ${IMAGE_FULL}"

        echo "Inspecting image architecture..."
        docker inspect --format='Architecture: {{.Architecture}}' "${IMAGE_FULL}"


  - task: Bash@3
    displayName: Trivy scan (fail on CRITICAL)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        mkdir -p "$HOME/.local/bin"
        export PATH="$HOME/.local/bin:$PATH"

        if ! command -v trivy >/dev/null 2>&1; then
          echo "Installing Trivy into \$HOME/.local/bin..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
        fi

        echo "Trivy version:"
        trivy --version

        echo "Running Trivy scan on image: $(IMAGE_FULL)"
        trivy image --severity CRITICAL --exit-code 1 --no-progress "$(IMAGE_FULL)"

  - publish: $(Build.SourcesDirectory)
    artifact: src
    displayName: Publish source artifact
