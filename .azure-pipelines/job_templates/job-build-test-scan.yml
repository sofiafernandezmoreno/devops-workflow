# job-build-test-scan.yml
parameters:
  imageRepository: ''
  serviceName: ''

jobs:
- job: build_test_scan
  displayName: Build, Test & Scan
  pool:
    name: Default

  steps:

  - checkout: self
    displayName: Checkout repository

  - task: Bash@3
    displayName: Set IMAGE_FULL variable
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        echo "##vso[task.setvariable variable=IMAGE_FULL]${{ parameters.imageRepository }}:${{ format('{0}.{1}', variables['Build.SourceBranchName'], variables['Build.BuildId']) }}"
        echo "IMAGE_FULL set to: $(IMAGE_FULL)"

  - task: Bash@3
    displayName: Build Docker image (linux/amd64)
    env:
      IMAGE_FULL: $(IMAGE_FULL)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        cd app

        echo "Building Docker image for linux/amd64"
        echo "IMAGE_FULL=${IMAGE_FULL}"

        # Create/Use buildx builder
        if ! docker buildx inspect multiarch-builder >/dev/null 2>&1; then
          echo "Creating buildx builder 'multiarch-builder'..."
          docker buildx create --use --name multiarch-builder
        else
          echo "Using existing buildx builder 'multiarch-builder'..."
          docker buildx use multiarch-builder
        fi

        docker buildx build \
          --platform linux/amd64 \
          --no-cache \
          -t "${IMAGE_FULL}" \
          --load \
          .

        echo "Image built: ${IMAGE_FULL}"
        docker inspect --format='Built Architecture: {{.Architecture}}' "${IMAGE_FULL}"

  - task: Bash@3
    displayName: Run tests
    inputs:
      targetType: inline
      script: |
        set -e
        echo "Running tests..."
        cd app
        ./mvnw test

  - task: Bash@3
    displayName: Trivy scan
    env:
      IMAGE_FULL: $(IMAGE_FULL)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        echo "Scanning image: ${IMAGE_FULL}"
        trivy image --exit-code 0 --severity HIGH,CRITICAL "${IMAGE_FULL}"

  - task: Bash@3
    displayName: Export build artifacts (image tag & digest)
    env:
      IMAGE_FULL: $(IMAGE_FULL)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail
        echo "Exporting image ref details..."

        mkdir -p "$(Build.ArtifactStagingDirectory)/image-ref"

        echo -n "${IMAGE_FULL}" > "$(Build.ArtifactStagingDirectory)/image-ref/image-tag.txt"
        echo "Image tag written: ${IMAGE_FULL}"

        docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_FULL}" > "$(Build.ArtifactStagingDirectory)/image-ref/image-digest.txt"
        echo "Digest written: $(cat $(Build.ArtifactStagingDirectory)/image-ref/image-digest.txt)"

  - task: PublishPipelineArtifact@1
    displayName: Publish image-ref artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/image-ref'
      artifact: image-ref
      publishLocation: pipeline
