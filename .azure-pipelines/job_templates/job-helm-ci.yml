# .azure-pipelines/job_templates/job-helm-ci.yml
jobs:
- job: helm_ci
  displayName: "Helm lint & snapshot tests"
  pool:
    name: 'sofia-self-hosted'

  variables:
    APP_NAME: 'nn-devops-challenge'

  steps:
    - download: current
      artifact: image-ref
      displayName: "Download image-ref artifact"

    - task: Bash@3
      displayName: "Install Helm 4"
      inputs:
        targetType: inline
        script: |
          set -euo pipefail

          if ! command -v helm >/dev/null 2>&1; then
            echo "Installing Helm 4..."
            HELM_VERSION="v4.0.0"
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tar.gz
            tar -xzf helm.tar.gz
            sudo mv linux-amd64/helm /usr/local/bin/helm
            rm -rf linux-amd64 helm.tar.gz
          fi

          helm version

    - task: Bash@3
      displayName: "Run Helm CI tests (lint + snapshots)"
      env:
        AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
        AWS_REGION: $(AWS_REGION)
        APP_NAME: 'nn-devops-challenge'
      inputs:
        targetType: inline
        script: |
          set -euo pipefail

          IMAGE_REPOSITORY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${APP_NAME}"

          IMAGE_REPOSITORY="$IMAGE_REPOSITORY" make helm-ci-test
