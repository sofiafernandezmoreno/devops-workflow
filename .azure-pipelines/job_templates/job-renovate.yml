# .azure-pipelines/job_templates/job-renovate.yml
parameters:
  poolName: 'sofia-self-hosted'
  azureEndpoint: 'https://dev.azure.com/sofia-nn-challenge'
  azureRepo: 'nn-devops-challenge/nn-devops-challenge' # project/repository

jobs:
- job: renovate
  displayName: Run Renovate Bot
  pool:
    name: ${{ parameters.poolName }}

  steps:
    - checkout: self
      clean: true

    - task: Bash@3
      displayName: Run Renovate (Docker)
      env:
        RENOVATE_TOKEN: $(RENOVATE_TOKEN)       
        RENOVATE_PLATFORM: 'azure'
        RENOVATE_ENDPOINT: ${{ parameters.azureEndpoint }}
        LOG_LEVEL: 'info'
        RENOVATE_REPOSITORIES: ${{ parameters.azureRepo }}
      inputs:
        targetType: inline
        script: |
          set -euo pipefail

          echo "Running Renovate for $RENOVATE_REPOSITORIES against $RENOVATE_ENDPOINT"

          docker run --rm \
            -e RENOVATE_TOKEN \
            -e RENOVATE_PLATFORM \
            -e RENOVATE_ENDPOINT \
            -e LOG_LEVEL \
            -e RENOVATE_REPOSITORIES \
            -v "$(System.DefaultWorkingDirectory)":/repo \
            -w /repo \
            renovate/renovate
