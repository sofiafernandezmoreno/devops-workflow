# .azure-pipelines/job_templates/job-push-and-sign.yml
parameters: {}

jobs:
- job: push_sign
  displayName: Push image to ECR & Cosign
  pool:
    name: 'sofia-self-hosted'

  steps:
  - checkout: self

  - download: current
    artifact: src
    displayName: Download source artifact

  # ----------------------------------------------------
  # 1) PUSH TO ECR (TAG + DIGEST)
  # ----------------------------------------------------
  - task: Bash@3
    displayName: Push image to ECR
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_REGION: $(AWS_REGION)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Ensuring ECR repository exists..."
        aws ecr describe-repositories \
          --repository-names "$(ECR_REPO)" \
          --region "$(AWS_REGION)" >/dev/null 2>&1 || \
        aws ecr create-repository \
          --repository-name "$(ECR_REPO)" \
          --region "$(AWS_REGION)" >/dev/null

        echo "Logging into ECR..."
        aws ecr get-login-password --region "$(AWS_REGION)" \
          | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

        echo "Building image: $(IMAGE_FULL)"
        cd app
        docker build -t "$(IMAGE_FULL)" .

        echo "Pushing image to ECR..."
        docker push "$(IMAGE_FULL)"

        echo "Resolving image digest from ECR..."
        IMAGE_DIGEST=$(aws ecr describe-images \
          --repository-name "$(ECR_REPO)" \
          --image-ids imageTag="$(IMAGE_TAG)" \
          --query 'imageDetails[0].imageDigest' \
          --output text)

        IMAGE_DIGEST_REF="$(CONTAINER_REGISTRY)/$(ECR_REPO)@${IMAGE_DIGEST}"

        echo "Storing image references and digest blob..."
        mkdir -p $(Pipeline.Workspace)/image-ref
        echo "$(IMAGE_FULL)"       > $(Pipeline.Workspace)/image-ref/image-tag.txt
        echo "${IMAGE_DIGEST_REF}" > $(Pipeline.Workspace)/image-ref/image-digest.txt
        printf "%s" "${IMAGE_DIGEST_REF}" > $(Pipeline.Workspace)/image-ref/digest.txt

  # ----------------------------------------------------
  # 2) COSIGN SIGN-BLOB (DIGEST SIGNATURE)
  # ----------------------------------------------------
  - task: Bash@3
    displayName: Cosign sign digest (blob)
    env:
      COSIGN_PASSWORD: $(COSIGN_PASSWORD)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Ensuring Cosign is available..."
        if ! command -v cosign >/dev/null 2>&1; then
          echo "Cosign not found in PATH, downloading local binary..."
          curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
          chmod +x cosign
          COSIGN_BIN=./cosign
        else
          COSIGN_BIN=cosign
        fi

        echo "Decoding Cosign keys..."
        echo "$(COSIGN_PRIVATE_KEY_B64)" | base64 -d > cosign.key
        echo "$(COSIGN_PUBLIC_KEY_B64)"  | base64 -d > cosign.pub

        DIGEST_FILE="$(Pipeline.Workspace)/image-ref/digest.txt"
        SIG_FILE="$(Pipeline.Workspace)/image-ref/digest.sig"

        echo "Signing digest blob with Cosign..."
        "${COSIGN_BIN}" \
          -t 60s \
          sign-blob \
          --key cosign.key \
          --tlog-upload=false \
          --output-signature "${SIG_FILE}" \
          "${DIGEST_FILE}"

        echo "Done signing digest. Signature stored at ${SIG_FILE}"

  # ----------------------------------------------------
  # 3) COSIGN VERIFY-BLOB (GLOBAL SECURITY GATE)
  # ----------------------------------------------------
  - task: Bash@3
    displayName: Cosign verify (global gate, digest blob)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Ensuring Cosign is available..."
        if ! command -v cosign >/dev/null 2>&1; then
          echo "Cosign not found in PATH, downloading local binary..."
          curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
          chmod +x cosign
          COSIGN_BIN=./cosign
        else
          COSIGN_BIN=cosign
        fi

        echo "Decoding public key..."
        echo "$(COSIGN_PUBLIC_KEY_B64)" | base64 -d > cosign.pub

        DIGEST_FILE="$(Pipeline.Workspace)/image-ref/digest.txt"
        SIG_FILE="$(Pipeline.Workspace)/image-ref/digest.sig"

        echo "Verifying digest blob signature with Cosign..."
        "${COSIGN_BIN}" \
          -t 60s \
          verify-blob \
          --key cosign.pub \
          --signature "${SIG_FILE}" \
          "${DIGEST_FILE}"

        echo "Global signature verification OK."

  # ----------------------------------------------------
  # 4) PUBLISH ARTIFACTS (DIGEST + SIGNATURE)
  # ----------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: Publish image-ref artifact
    inputs:
      pathToPublish: $(Pipeline.Workspace)/image-ref
      artifactName: image-ref
