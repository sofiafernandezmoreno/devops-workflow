# job-push-and-sign.yml
jobs:
- job: push_and_sign
  displayName: Push & Sign Image
  pool:
    name: Default

  steps:

  - checkout: none

  - download: current
    artifact: image-ref
    displayName: Download build artifacts

  - task: Bash@3
    displayName: Docker login & push to ECR
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_REGION: $(AWS_REGION)
      IMAGE_FULL: $(IMAGE_FULL)
      CONTAINER_REGISTRY: $(CONTAINER_REGISTRY)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Logging in to ECR..."
        aws ecr get-login-password --region "$(AWS_REGION)" \
          | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

        TAG_REF="$(cat $(Pipeline.Workspace)/image-ref/image-tag.txt)"
        echo "Pushing ${TAG_REF}"

        docker push "${TAG_REF}"

  - task: Bash@3
    displayName: Cosign sign image
    env:
      COSIGN_PRIVATE_KEY_B64: $(COSIGN_PRIVATE_KEY_B64)
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_REGION: $(AWS_REGION)
      CONTAINER_REGISTRY: $(CONTAINER_REGISTRY)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Installing Cosign..."
        curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
        chmod +x cosign

        echo "Decoding private key..."
        echo "$COSIGN_PRIVATE_KEY_B64" | base64 -d > cosign.key

        IMAGE_DIGEST_REF="$(cat $(Pipeline.Workspace)/image-ref/image-digest.txt)"
        echo "Signing digest: ${IMAGE_DIGEST_REF}"

        aws ecr get-login-password --region "$(AWS_REGION)" \
          | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

        ./cosign sign \
          --key cosign.key \
          --tlog-upload=false \
          --yes \
          "${IMAGE_DIGEST_REF}"
