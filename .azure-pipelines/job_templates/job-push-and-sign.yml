# .azure-pipelines/job_templates/job-push-and-sign.yml
parameters: {}

jobs:
- job: push_sign
  displayName: Push image to ECR & Cosign
  pool:
    name: 'sofia-self-hosted'

  steps:
  - checkout: self

  - download: current
    artifact: src
    displayName: Download source artifact

  # ----------------------------------------------------
  # PUSH TO ECR
  # ----------------------------------------------------
  - task: Bash@3
    displayName: Push image to ECR
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_REGION: $(AWS_REGION)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        # Install AWS CLI if not present
        if ! command -v aws >/dev/null 2>&1; then
          echo "Installing AWS CLI..."
          curl -sSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
          sudo installer -pkg AWSCLIV2.pkg -target /
        fi

        echo "Ensuring ECR repository exists..."
        aws ecr describe-repositories \
          --repository-names "$(ECR_REPO)" \
          --region "$(AWS_REGION)" >/dev/null 2>&1 || \
        aws ecr create-repository \
          --repository-name "$(ECR_REPO)" \
          --region "$(AWS_REGION)" >/dev/null

        echo "Logging into ECR..."
        aws ecr get-login-password --region "$(AWS_REGION)" \
          | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

        echo "Building image: $(IMAGE_FULL)"
        cd app
        docker build -t "$(IMAGE_FULL)" .

        echo "Pushing image to ECR..."
        docker push "$(IMAGE_FULL)"

        echo "Resolving image digest from ECR..."
        IMAGE_DIGEST=$(aws ecr describe-images \
          --repository-name "$(ECR_REPO)" \
          --image-ids imageTag="$(IMAGE_TAG)" \
          --query 'imageDetails[0].imageDigest' \
          --output text)

        IMAGE_DIGEST_REF="$(CONTAINER_REGISTRY)/$(ECR_REPO)@${IMAGE_DIGEST}"

        echo "Storing image references..."
        mkdir -p $(Pipeline.Workspace)/image-ref
        echo "$(IMAGE_FULL)" > $(Pipeline.Workspace)/image-ref/image-tag.txt
        echo "${IMAGE_DIGEST_REF}" > $(Pipeline.Workspace)/image-ref/image-digest.txt

        echo "Logging out from ECR..."
        docker logout "$(CONTAINER_REGISTRY)" || true

  # ----------------------------------------------------
  # COSIGN SIGN (BY DIGEST)
  # ----------------------------------------------------
  - task: Bash@3
    displayName: Cosign sign image (by digest)
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_REGION: $(AWS_REGION)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Installing Cosign..."
        curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
        chmod +x cosign
        sudo mv cosign /usr/local/bin/

        echo "Decoding Cosign keys..."
        echo "$(COSIGN_PRIVATE_KEY_B64)" | base64 -d > cosign.key
        echo "$(COSIGN_PUBLIC_KEY_B64)"  | base64 -d > cosign.pub

        echo "Logging into ECR before signing..."
        aws ecr get-login-password --region "$(AWS_REGION)" \
          | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

        echo "Resolving image digest from ECR..."
        IMAGE_DIGEST=$(aws ecr describe-images \
          --repository-name "$(ECR_REPO)" \
          --image-ids imageTag="$(IMAGE_TAG)" \
          --query 'imageDetails[0].imageDigest' \
          --output text)

        IMAGE_DIGEST_REF="$(CONTAINER_REGISTRY)/$(ECR_REPO)@${IMAGE_DIGEST}"

        echo "Signing image with Cosign (by digest)..."
        COSIGN_PASSWORD="${COSIGN_PASSWORD:-}" cosign sign --key cosign.key "${IMAGE_DIGEST_REF}"

  # ----------------------------------------------------
  # COSIGN VERIFY (GLOBAL GATE, BY DIGEST)
  # ----------------------------------------------------
  - task: Bash@3
    displayName: Cosign verify (global gate, by digest)
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_REGION: $(AWS_REGION)
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "Installing Cosign..."
        curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
        chmod +x cosign
        sudo mv cosign /usr/local/bin/

        echo "Decoding public key..."
        echo "$(COSIGN_PUBLIC_KEY_B64)" | base64 -d > cosign.pub

        echo "Logging into ECR before verification..."
        aws ecr get-login-password --region "$(AWS_REGION)" \
          | docker login --username AWS --password-stdin "$(CONTAINER_REGISTRY)"

        echo "Resolving image digest from ECR..."
        IMAGE_DIGEST=$(aws ecr describe-images \
          --repository-name "$(ECR_REPO)" \
          --image-ids imageTag="$(IMAGE_TAG)" \
          --query 'imageDetails[0].imageDigest' \
          --output text)

        IMAGE_DIGEST_REF="$(CONTAINER_REGISTRY)/$(ECR_REPO)@${IMAGE_DIGEST}"

        echo "Verifying image signature with Cosign (by digest)..."
        cosign verify --key cosign.pub "${IMAGE_DIGEST_REF}"

  # ----------------------------------------------------
  # PUBLISH IMAGE REFERENCE ARTIFACT
  # ----------------------------------------------------
  - task: PublishBuildArtifacts@1
    displayName: Publish image-ref artifact
    inputs:
      pathToPublish: $(Pipeline.Workspace)/image-ref
      artifactName: image-ref
