# .azure-pipelines/stages-deploy.yml
parameters:
  stageName: ''
  displayName: ''
  envName: ''            # dev / staging / prod
  environmentName: ''    # Environment in Azure DevOps
  namespaceVar: ''       # p.ej. $(NAMESPACE_DEV)
  clusterNameVar: ''     # p.ej. $(CLUSTER_NAME_DEV)
  dependsOnStage: ''     # p.ej. PushAndSign / Deploy_Dev / Deploy_Staging
  extraCondition: 'succeeded()'

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOnStage }}
  condition: ${{ parameters.extraCondition }}
  jobs:
  - deployment: deploy_job
    displayName: Deploy ${{ parameters.envName }}
    pool:
      name: 'sofia-self-hosted'
    environment: ${{ parameters.environmentName }}
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: image-ref
            displayName: Download image-ref artifact

          - bash: |
              set -euo pipefail
              IMAGE="$(cat $(Pipeline.Workspace)/image-ref/image.txt)"
              echo "IMAGE=${IMAGE}" >> $(Pipeline.Workspace)/image.env
            displayName: Read image reference

          - bash: |
              set -euo pipefail
              source $(Pipeline.Workspace)/image.env

              curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign
              chmod +x cosign
              sudo mv cosign /usr/local/bin/

              echo "$(COSIGN_PUBLIC_KEY_B64)" | base64 -d > cosign.pub
              cosign verify --key cosign.pub "${IMAGE}"
            displayName: Verify signature (${{ parameters.envName }} gate)

          - bash: |
              set -euo pipefail
              source $(Pipeline.Workspace)/image.env

              CLUSTER_NAME=${{ parameters.clusterNameVar }}
              NAMESPACE=${{ parameters.namespaceVar }}

              # Kubeconfig
              aws eks update-kubeconfig --region "$(AWS_REGION)" --name "${CLUSTER_NAME}"

              # Namespace
              kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1 || \
                kubectl create namespace "${NAMESPACE}"

              ./scripts/deploy.sh ${{ parameters.envName }} "${IMAGE}" ./helm "${NAMESPACE}"
            displayName: Helm deploy to ${{ parameters.envName }}
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_REGION: $(AWS_REGION)
