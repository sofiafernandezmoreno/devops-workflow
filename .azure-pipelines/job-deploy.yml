# .azure-pipelines/job-deploy.yml
parameters:
  - name: envName # dev / staging / prod
    type: string
    default: ''
  - name: environmentName # name of the Environment in Azure DevOps
    type: string
    default: ''
  - name: namespaceVar # $(NAMESPACE_DEV) / ...
    type: string
    default: ''
  - name: clusterNameVar # $(CLUSTER_NAME_DEV) / ...
    type: string
    default: ''

jobs:
- deployment: deploy_${{ parameters.envName }}
  displayName: Deploy to ${{ parameters.envName }}
  environment: ${{ parameters.environmentName }}
  strategy:
    runOnce:
      deploy:
        steps:
        - download: current
          artifact: image-ref
          displayName: Download image-ref

        - bash: |
            set -euo pipefail
            IMAGE="$(cat $(Pipeline.Workspace)/image-ref/image.txt)"
            echo "IMAGE=${IMAGE}" >> $(Pipeline.Workspace)/image.env
          displayName: Read image reference

        - bash: |
            set -euo pipefail
            source $(Pipeline.Workspace)/image.env

            curl -sSL https://github.com/sigstore/cosign/releases/latest/download/cosign-darwin-arm64 -o cosign
            chmod +x cosign
            sudo mv cosign /usr/local/bin/

            echo "$(COSIGN_PUBLIC_KEY_B64)" | base64 -d > cosign.pub
            cosign verify --key cosign.pub "${IMAGE}"
          displayName: Verify signature (${{ parameters.envName }} gate)

        - bash: |
            set -euo pipefail
            source $(Pipeline.Workspace)/image.env

            CLUSTER_NAME="${{ parameters.clusterNameVar }}"
            NAMESPACE="${{ parameters.namespaceVar }}"

            if ! command -v aws >/dev/null 2>&1; then
              echo "Installing AWS CLI..."
              curl -sSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
              sudo installer -pkg AWSCLIV2.pkg -target /
            fi

            if ! command -v helm >/dev/null 2>&1; then
              curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            fi

            aws eks update-kubeconfig --region "$(AWS_REGION)" --name "${CLUSTER_NAME}"

            kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1 || \
              kubectl create namespace "${NAMESPACE}"

            ./scripts/deploy.sh "${{ parameters.envName }}" "${IMAGE}" ./helm "${NAMESPACE}"
          displayName: Helm deploy to ${{ parameters.envName }}
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_REGION: $(AWS_REGION)
